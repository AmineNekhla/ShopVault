<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ShopVault — E-Commerce Platform</title>
<meta name="description" content="Modern e-commerce store with shopping cart and category filtering."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#0ea5e9;--accent-hover:#0284c7;--border:#334155;--card:rgba(255,255,255,0.05);--red:#ef4444;--tr:0.3s ease;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
button{border:none;background:none;cursor:pointer;font-family:inherit;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* Navbar */
.navbar{position:sticky;top:0;background:rgba(30,41,59,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:15px 5%;display:flex;justify-content:space-between;align-items:center;z-index:100;}
.logo{font-size:1.5rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:10px;}
.nav-links{display:flex;gap:20px;}
.nav-links a{font-weight:500;transition:var(--tr);}
.nav-links a:hover,.nav-links a.active{color:var(--accent);}
.cart-btn{position:relative;font-size:1.2rem;color:var(--text);transition:var(--tr);}
.cart-btn:hover{color:var(--accent);}
.cart-count{position:absolute;top:-8px;right:-10px;background:var(--red);color:#fff;font-size:0.7rem;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;justify-content:center;align-items:center;}

/* Main Layout */
.container{display:flex;padding:30px 5%;gap:30px;min-height:calc(100vh - 70px);}

/* Sidebar Filters */
.sidebar{width:250px;flex-shrink:0;}
.filter-group{margin-bottom:25px;}
.filter-title{font-size:1.1rem;font-weight:600;margin-bottom:15px;border-bottom:1px solid var(--border);padding-bottom:10px;}
.filter-list{display:flex;flex-direction:column;gap:10px;}
.filter-item{display:flex;align-items:center;gap:10px;color:var(--muted);cursor:pointer;transition:var(--tr);}
.filter-item:hover,.filter-item.active{color:var(--accent);}
.filter-item input{cursor:pointer;accent-color:var(--accent);}

/* Products Grid */
.products-area{flex:1;}
.products-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.sort-select{background:var(--bg2);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;outline:none;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}

/* Product Card */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:var(--tr);display:flex;flex-direction:column;}
.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 10px 20px rgba(0,0,0,0.3);}
.card-img{width:100%;height:200px;background:var(--bg3);display:flex;justify-content:center;align-items:center;position:relative;}
.card-img i{font-size:4rem;color:var(--muted);}
.badge{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:0.7rem;font-weight:600;padding:4px 8px;border-radius:4px;}
.card-info{padding:15px;flex:1;display:flex;flex-direction:column;}
.card-title{font-size:1.05rem;font-weight:600;margin-bottom:5px;}
.card-brand{font-size:0.8rem;color:var(--muted);margin-bottom:10px;}
.card-price{font-size:1.2rem;font-weight:700;color:var(--accent);margin-top:auto;}
.add-btn{width:100%;background:var(--bg3);color:var(--text);border:none;padding:10px;margin-top:15px;border-radius:6px;font-weight:600;transition:var(--tr);display:flex;justify-content:center;align-items:center;gap:8px;}
.add-btn:hover{background:var(--accent);color:#fff;}

/* Cart Sidebar */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;opacity:0;pointer-events:none;transition:var(--tr);}
.cart-overlay.open{opacity:1;pointer-events:all;}
.cart-sidebar{position:fixed;top:0;right:-400px;width:100%;max-width:400px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transition:right 0.3s ease;}
.cart-sidebar.open{right:0;}
.cart-header{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--border);}
.close-cart{font-size:1.5rem;color:var(--muted);transition:var(--tr);}
.close-cart:hover{color:var(--text);}
.cart-items{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px;}
.cart-item{display:flex;gap:15px;background:var(--bg3);padding:10px;border-radius:8px;}
.cart-item-img{width:60px;height:60px;background:var(--bg);border-radius:6px;display:flex;justify-content:center;align-items:center;}
.cart-item-info{flex:1;}
.cart-item-title{font-size:0.9rem;font-weight:600;}
.cart-item-price{color:var(--accent);font-weight:700;margin-top:5px;}
.qty-controls{display:flex;align-items:center;gap:10px;margin-top:10px;}
.qty-btn{width:24px;height:24px;background:var(--bg);border-radius:4px;color:var(--text);display:flex;justify-content:center;align-items:center;font-weight:bold;}
.qty-btn:hover{background:var(--accent);}
.remove-btn{color:var(--red);font-size:0.8rem;margin-left:auto;}
.cart-footer{padding:20px;border-top:1px solid var(--border);background:var(--bg2);}
.cart-total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;margin-bottom:15px;}
.checkout-btn{width:100%;background:var(--accent);color:#fff;padding:15px;border-radius:8px;font-size:1.1rem;font-weight:600;transition:var(--tr);}
.checkout-btn:hover{background:var(--accent-hover);}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:#fff;padding:12px 24px;border-radius:30px;font-weight:600;z-index:300;opacity:0;transition:var(--tr);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

@media (max-width:768px){
  .container{flex-direction:column;}
  .sidebar{width:100%;}
  .filter-list{flex-direction:row;flex-wrap:wrap;}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo"><i class="fa-solid fa-cube"></i> ShopVault</div>
  <div class="nav-links">
    <a href="#" class="active">Home</a>
    <a href="#">Categories</a>
    <a href="#">Deals</a>
  </div>
  <button class="cart-btn" onclick="toggleCart()">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="cart-count" id="cartCount">0</span>
  </button>
</nav>

<div class="container">
  <aside class="sidebar">
    <div class="filter-group">
      <div class="filter-title">Categories</div>
      <div class="filter-list" id="categoryFilters">
        <label class="filter-item active"><input type="radio" name="cat" value="all" checked/> All Products</label>
        <label class="filter-item"><input type="radio" name="cat" value="electronics"/> Electronics</label>
        <label class="filter-item"><input type="radio" name="cat" value="wearables"/> Wearables</label>
        <label class="filter-item"><input type="radio" name="cat" value="accessories"/> Accessories</label>
      </div>
    </div>
  </aside>

  <main class="products-area">
    <div class="products-header">
      <h2 id="pageTitle">All Products</h2>
      <select class="sort-select" id="sortSelect">
        <option value="featured">Featured</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
      </select>
    </div>
    <div class="grid" id="productsGrid">
      <!-- Products will be injected here -->
    </div>
  </main>
</div>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <h3>Your Cart</h3>
    <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="cart-items" id="cartItems">
    <!-- Cart items will be injected here -->
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total:</span>
      <span id="cartTotal">$0.00</span>
    </div>
    <button class="checkout-btn" onclick="checkout()"><i class="fa-solid fa-lock"></i> Checkout Securely</button>
  </div>
</div>

<div class="toast" id="toast">Item added to cart!</div>

<script>
const PRODUCTS = [
  {id: 1, name: 'Quantum Pro Laptop', brand: 'Quantum', price: 1299.99, cat: 'electronics', icon: 'fa-laptop', badge: 'New'},
  {id: 2, name: 'SonicBuds X', brand: 'Sonic', price: 149.99, cat: 'wearables', icon: 'fa-headphones', badge: 'Sale'},
  {id: 3, name: 'Vortex Mechanical Keyboard', brand: 'Vortex', price: 129.50, cat: 'accessories', icon: 'fa-keyboard'},
  {id: 4, name: 'Lumina 4K Monitor', brand: 'Lumina', price: 349.00, cat: 'electronics', icon: 'fa-desktop'},
  {id: 5, name: 'AeroFit Smartwatch', brand: 'Aero', price: 199.99, cat: 'wearables', icon: 'fa-clock', badge: 'Popular'},
  {id: 6, name: 'Nimbus Wireless Mouse', brand: 'Nimbus', price: 49.99, cat: 'accessories', icon: 'fa-computer-mouse'},
  {id: 7, name: 'EchoSound Soundbar', brand: 'Echo', price: 249.99, cat: 'electronics', icon: 'fa-speaker'},
  {id: 8, name: 'PowerCore 20k Powerbank', brand: 'Volt', price: 39.99, cat: 'accessories', icon: 'fa-battery-full'},
];

let cart = JSON.parse(localStorage.getItem('shopvault_cart')) || [];
let currentCategory = 'all';

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';
  
  let filtered = PRODUCTS.filter(p => currentCategory === 'all' || p.cat === currentCategory);
  
  const sort = document.getElementById('sortSelect').value;
  if(sort === 'price-low') filtered.sort((a,b) => a.price - b.price);
  if(sort === 'price-high') filtered.sort((a,b) => b.price - a.price);

  filtered.forEach(p => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="card-img">
        ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
        <i class="fa-solid ${p.icon}"></i>
      </div>
      <div class="card-info">
        <div class="card-title">${p.name}</div>
        <div class="card-brand">${p.brand}</div>
        <div class="card-price">$${p.price.toFixed(2)}</div>
        <button class="add-btn" onclick="addToCart(${p.id})">
          <i class="fa-solid fa-cart-plus"></i> Add to Cart
        </button>
      </div>
    `;
    grid.appendChild(div);
  });
}

function renderCart() {
  const container = document.getElementById('cartItems');
  container.innerHTML = '';
  let total = 0;
  let count = 0;

  if (cart.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--muted);margin-top:20px;">Your cart is empty.</div>';
  } else {
    cart.forEach(item => {
      const p = PRODUCTS.find(x => x.id === item.id);
      if(!p) return;
      total += p.price * item.qty;
      count += item.qty;
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <div class="cart-item-img"><i class="fa-solid ${p.icon} fa-2x" style="color:var(--muted)"></i></div>
        <div class="cart-item-info">
          <div class="cart-item-title">${p.name}</div>
          <div class="cart-item-price">$${p.price.toFixed(2)}</div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${p.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
            <button class="remove-btn" onclick="updateQty(${p.id}, -99)"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `;
      container.appendChild(div);
    });
  }

  document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
  document.getElementById('cartCount').textContent = count;
  localStorage.setItem('shopvault_cart', JSON.stringify(cart));
}

function addToCart(id) {
  const existing = cart.find(x => x.id === id);
  if(existing) existing.qty++;
  else cart.push({id, qty: 1});
  renderCart();
  showToast('Item added to cart!');
}

function updateQty(id, delta) {
  const item = cart.find(x => x.id === id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) cart = cart.filter(x => x.id !== id);
  renderCart();
}

function toggleCart() {
  document.getElementById('cartSidebar').classList.toggle('open');
  document.getElementById('cartOverlay').classList.toggle('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function checkout() {
  if(cart.length === 0) return showToast('Cart is empty!');
  showToast('Processing checkout...');
  setTimeout(() => {
    cart = [];
    renderCart();
    toggleCart();
    showToast('Order placed successfully! 🎉');
  }, 1500);
}

// Event Listeners
document.querySelectorAll('input[name="cat"]').forEach(radio => {
  radio.addEventListener('change', (e) => {
    currentCategory = e.target.value;
    document.querySelectorAll('.filter-item').forEach(el => el.classList.remove('active'));
    e.target.parentElement.classList.add('active');
    document.getElementById('pageTitle').textContent = e.target.parentElement.textContent.trim();
    renderProducts();
  });
});

document.getElementById('sortSelect').addEventListener('change', renderProducts);

// Init
renderProducts();
renderCart();
</script>
</body>
</html>
